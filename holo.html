<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const Q = new URLSearchParams(location.search);
if (Q.has('noui')) document.body.classList.add('noui');
const CW = 1000, CH = 1400, CARD_W = 2.5, CARD_H = 3.5;
const mk = (w = CW, h = CH) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const cv = { bgFar: mk(), bgNear: mk(), char: mk(), line: mk(), frame: mk(), back: mk() };
const ctx = (k) => cv[k].getContext('2d', { willReadFrequently: k === 'char' });
const rng = (s) => () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const TAU = Math.PI * 2;

/* ───────────── demo art: a Nara deer at dusk, all drawn in code ───────────── */
function drawBgFar(c) {
  const r = rng(7);
  const g = c.createLinearGradient(0, 0, 0, CH);
  g.addColorStop(0, '#140c33'); g.addColorStop(.38, '#3a1c63'); g.addColorStop(.62, '#9a3f78');
  g.addColorStop(.8, '#ee8f62'); g.addColorStop(1, '#ffd49a');
  c.fillStyle = g; c.fillRect(0, 0, CW, CH);
  for (let i = 0; i < 320; i++) {               // stars
    const x = r() * CW, y = r() * CH * .62, s = r() ** 3 * 2.6 + .5;
    c.globalAlpha = (.25 + r() * .75) * (1 - y / (CH * .7)); c.fillStyle = '#fff';
    c.beginPath(); c.arc(x, y, s, 0, TAU); c.fill();
  }
  c.globalAlpha = 1;
  const sx = 520, sy = 640;                       // the setting sun
  let rg = c.createRadialGradient(sx, sy, 60, sx, sy, 560);
  rg.addColorStop(0, 'rgba(255,200,160,.5)'); rg.addColorStop(.35, 'rgba(255,150,120,.18)'); rg.addColorStop(1, 'rgba(255,120,140,0)');
  c.fillStyle = rg; c.fillRect(0, 0, CW, CH);
  rg = c.createLinearGradient(0, sy - 230, 0, sy + 230);
  rg.addColorStop(0, '#ffd9a8'); rg.addColorStop(1, '#f07a62');
  c.fillStyle = rg; c.beginPath(); c.arc(sx, sy, 230, 0, TAU); c.fill();
  c.strokeStyle = 'rgba(255,240,220,.16)';
  for (let i = 0; i < 7; i++) { c.lineWidth = 2 + i * .4; c.beginPath(); c.arc(sx, sy, 280 + i * 46, 0, TAU); c.stroke(); }
}

function drawBgNear(c) {
  c.clearRect(0, 0, CW, CH);
  const r = rng(11);
  c.fillStyle = '#6a2d5c';                        // far ridge
  c.beginPath(); c.moveTo(0, 1010); c.bezierCurveTo(200, 950, 420, 1000, 600, 960); c.bezierCurveTo(780, 925, 900, 960, 1000, 940); c.lineTo(1000, CH); c.lineTo(0, CH); c.fill();
  c.fillStyle = '#47204f';                        // three soft humps (Wakakusa-like)
  c.beginPath(); c.moveTo(0, 1080); c.bezierCurveTo(150, 1000, 280, 1010, 380, 1050); c.bezierCurveTo(480, 990, 640, 990, 720, 1040);
  c.bezierCurveTo(820, 1000, 930, 1010, 1000, 1040); c.lineTo(1000, CH); c.lineTo(0, CH); c.fill();
  // pagoda silhouette
  c.fillStyle = '#2c1238';
  const px = 160, base = 1070;
  c.fillRect(px - 4, base - 520, 8, 120);
  for (let i = 0; i < 9; i++) { c.beginPath(); c.arc(px, base - 520 + 20 + i * 11, 9 - i * .4, 0, TAU); c.fill(); }
  for (let i = 0; i < 5; i++) {
    const y = base - i * 82, w = 118 - i * 13;
    c.beginPath(); c.moveTo(px - w, y - 28); c.quadraticCurveTo(px - w * .6, y - 22, px - w * .45, y - 46);
    c.lineTo(px + w * .45, y - 46); c.quadraticCurveTo(px + w * .6, y - 22, px + w, y - 28); c.lineTo(px + w * .8, y - 18); c.lineTo(px - w * .8, y - 18); c.fill();
    c.fillRect(px - w * .42, y - 20, w * .84, 26);
  }
  c.fillStyle = '#1e0c27';                        // ground
  c.beginPath(); c.moveTo(0, 1170); c.bezierCurveTo(300, 1140, 650, 1160, 1000, 1135); c.lineTo(1000, CH); c.lineTo(0, CH); c.fill();
  for (let i = 0; i < 70; i++) {                  // grass
    const x = r() * CW, y = 1150 + r() * 40, h = 14 + r() * 26;
    c.strokeStyle = 'rgba(70,30,80,.9)'; c.lineWidth = 2.4;
    c.beginPath(); c.moveTo(x, y + 10); c.quadraticCurveTo(x + 3, y - h * .5, x + (r() - .5) * 18, y - h); c.stroke();
  }
  // sakura branch from the top right
  c.strokeStyle = '#2b1426'; c.lineCap = 'round';
  const branch = (x0, y0, x1, y1, cx, cy, w) => { c.lineWidth = w; c.beginPath(); c.moveTo(x0, y0); c.quadraticCurveTo(cx, cy, x1, y1); c.stroke(); };
  branch(1010, 150, 690, 300, 860, 170, 22); branch(860, 205, 760, 150, 820, 165, 10); branch(760, 268, 640, 360, 700, 300, 9); branch(930, 175, 910, 300, 935, 240, 8);
  const blossom = (x, y, s) => {
    c.save(); c.translate(x, y); c.rotate(r() * TAU);
    for (let k = 0; k < 5; k++) {
      c.rotate(TAU / 5); c.fillStyle = k % 2 ? '#ffc6dc' : '#ffb2cf';
      c.beginPath(); c.ellipse(0, -s * .55, s * .42, s * .6, 0, 0, TAU); c.fill();
    }
    c.fillStyle = '#ff7aa8'; c.beginPath(); c.arc(0, 0, s * .2, 0, TAU); c.fill(); c.restore();
  };
  const pts = [[700, 300], [760, 270], [640, 360], [770, 160], [820, 215], [900, 200], [920, 290], [960, 165], [690, 330], [860, 240], [740, 230], [600, 380]];
  for (const [x, y] of pts) for (let k = 0; k < 3; k++) blossom(x + (r() - .5) * 60, y + (r() - .5) * 50, 14 + r() * 12);
  for (let i = 0; i < 26; i++) {                  // falling petals
    const x = r() * CW, y = 300 + r() * 800;
    c.save(); c.translate(x, y); c.rotate(r() * TAU); c.fillStyle = `rgba(255,${180 + r() * 40 | 0},210,${.55 + r() * .4})`;
    c.beginPath(); c.ellipse(0, 0, 9, 5, 0, 0, TAU); c.fill(); c.restore();
  }
}

function deerShapes() {
  const E = (x, y, rx, ry, a = 0) => { const p = new Path2D(); p.ellipse(x, y, rx, ry, a, 0, TAU); return p; };
  const P = (d) => new Path2D(d);
  return {
    legsBack: [P('M636 928 C 628 1010, 646 1080, 640 1166 L 668 1166 C 676 1080, 690 1000, 702 926 Z'),
               P('M702 916 C 716 1000, 736 1080, 734 1164 L 762 1164 C 766 1080, 762 990, 752 898 Z')],
    tail: E(774, 848, 28, 17, .6),
    body: E(566, 880, 216, 112, -.04),
    legsFront: [P('M380 930 C 384 1010, 378 1090, 372 1172 L 400 1172 C 410 1090, 418 1010, 422 935 Z'),
                P('M442 935 C 448 1010, 452 1090, 452 1176 L 480 1176 C 484 1090, 484 1010, 480 928 Z')],
    neck: P('M352 872 C 326 780, 318 700, 322 628 L 420 646 C 414 712, 432 786, 472 842 Z'),
    chest: E(404, 866, 92, 108, .2),
    head: E(348, 585, 80, 58, -.35),
    earL: E(282, 528, 50, 20, .55), earR: E(418, 540, 52, 20, -.55),
    snout: E(278, 626, 50, 36, -.45),
    antlers: ['M326 540 C 318 480, 300 440, 270 398', 'M312 478 C 290 466, 272 454, 256 432', 'M298 436 C 302 410, 306 388, 298 360',
              'M372 546 C 388 484, 410 444, 442 404', 'M394 482 C 418 472, 440 466, 458 448', 'M418 440 C 422 414, 422 392, 432 364'].map(P),
    spots: [[500, 852, 10], [556, 832, 9], [612, 860, 10], [664, 842, 8], [540, 896, 8], [622, 906, 9], [700, 872, 8], [470, 890, 7], [590, 812, 7]],
  };
}

function drawDeer(c, mode) {
  const S = deerShapes(), line = mode === 'line';
  if (line) { c.fillStyle = '#fff'; c.fillRect(0, 0, CW, CH); } else c.clearRect(0, 0, CW, CH);
  const fur = c.createLinearGradient(0, 520, 0, 1170);
  fur.addColorStop(0, '#d39456'); fur.addColorStop(.5, '#a8642f'); fur.addColorStop(1, '#6d391b');
  const shape = (p, fill) => {
    if (line) { c.fillStyle = '#fff'; c.fill(p); c.strokeStyle = '#000'; c.lineWidth = 6; c.stroke(p); }
    else { c.fillStyle = fill; c.fill(p); c.strokeStyle = 'rgba(60,28,12,.55)'; c.lineWidth = 3; c.stroke(p); }
  };
  c.lineJoin = c.lineCap = 'round';
  S.legsBack.forEach((p) => shape(p, '#7b4523'));
  shape(S.tail, '#8d5128');
  shape(S.body, fur);
  if (!line) {                                    // belly light
    c.save(); c.clip(S.body); c.fillStyle = 'rgba(240,200,150,.45)';
    c.beginPath(); c.ellipse(560, 965, 180, 48, 0, 0, TAU); c.fill(); c.restore();
  }
  S.legsFront.forEach((p) => shape(p, fur));
  shape(S.neck, fur); shape(S.chest, fur);
  if (!line) { c.save(); c.clip(S.chest); c.fillStyle = 'rgba(245,220,180,.55)'; c.beginPath(); c.ellipse(380, 900, 46, 70, .2, 0, TAU); c.fill(); c.restore(); }
  shape(S.earL, '#b8733c'); shape(S.earR, '#b8733c');
  if (!line) for (const [x, y, a] of [[282, 528, .55], [418, 540, -.55]]) { c.fillStyle = '#efb9a2'; c.beginPath(); c.ellipse(x, y, 30, 9, a, 0, TAU); c.fill(); }
  shape(S.head, fur); shape(S.snout, '#dcab7b');
  // nose, eye
  c.fillStyle = line ? '#000' : '#26160f';
  c.beginPath(); c.ellipse(240, 642, 16, 12, -.4, 0, TAU); c.fill();
  c.beginPath(); c.ellipse(334, 576, 11, 12, 0, 0, TAU); c.fill();
  if (!line) { c.fillStyle = '#fff'; c.beginPath(); c.arc(330, 571, 3.5, 0, TAU); c.fill(); }
  // antlers
  for (const p of S.antlers) {
    if (line) { c.strokeStyle = '#000'; c.lineWidth = 22; c.stroke(p); }
    else { c.strokeStyle = 'rgba(80,50,30,.6)'; c.lineWidth = 16; c.stroke(p); }
  }
  for (const p of S.antlers) { c.strokeStyle = line ? '#fff' : '#efdcb6'; c.lineWidth = line ? 10 : 12; c.stroke(p); }
  // spots
  for (const [x, y, s] of S.spots) {
    c.beginPath(); c.ellipse(x, y, s, s * .8, 0, 0, TAU);
    if (line) { c.strokeStyle = '#000'; c.lineWidth = 3.5; c.stroke(); } else { c.fillStyle = 'rgba(250,238,215,.92)'; c.fill(); }
  }
  // hooves
  for (const [x, y] of [[386, 1172], [466, 1176], [654, 1166], [748, 1164]]) {
    c.fillStyle = line ? '#000' : '#3a2416'; c.beginPath(); c.roundRect(x - 15, y - 14, 30, 16, 5); c.fill();
  }
}

function drawFrame() {
  const c = ctx('frame'); c.clearRect(0, 0, CW, CH);
  const gold = c.createLinearGradient(0, 0, CW, CH);
  ['#8a6a2a', '#f8e4a6', '#b8913f', '#fff3c8', '#a07c34', '#f2d48c'].forEach((s, i, a) => gold.addColorStop(i / (a.length - 1), s));
  c.strokeStyle = gold; c.lineWidth = 18; c.beginPath(); c.roundRect(20, 20, CW - 40, CH - 40, 48); c.stroke();
  c.strokeStyle = 'rgba(255,232,180,.75)'; c.lineWidth = 2.5; c.beginPath(); c.roundRect(44, 44, CW - 88, CH - 88, 34); c.stroke();
  c.fillStyle = gold; c.font = '700 26px Inter, sans-serif'; c.textBaseline = 'alphabetic';
  c.fillText('★  SPECIAL ART', 74, 100);
  c.textAlign = 'right'; c.fillText('No.' + (document.getElementById('no').value || '001'), CW - 74, 100); c.textAlign = 'left';
  // name plate
  c.fillStyle = 'rgba(16,8,26,.74)'; c.beginPath(); c.roundRect(58, 1200, CW - 116, 128, 22); c.fill();
  c.strokeStyle = gold; c.lineWidth = 4; c.stroke();
  const name = document.getElementById('name').value || ' ';
  let fs = 62; c.font = `900 ${fs}px "Noto Serif JP", serif`;
  while (c.measureText(name).width > 560 && fs > 30) { fs -= 2; c.font = `900 ${fs}px "Noto Serif JP", serif`; }
  c.fillStyle = gold; c.fillText(name, 96, 1286);
  c.textAlign = 'right'; c.font = '700 22px Inter, sans-serif'; c.fillText('HOLO CARD', CW - 96, 1262);
  c.font = '600 19px "Noto Serif JP", serif'; c.fillStyle = 'rgba(255,236,196,.8)'; c.fillText('あなたの一枚', CW - 96, 1298); c.textAlign = 'left';
  T && (T.frame.needsUpdate = true);
}

function drawBack() {
  const c = ctx('back');
  const g = c.createLinearGradient(0, 0, CW, CH);
  g.addColorStop(0, '#1b1446'); g.addColorStop(.5, '#3a1d5c'); g.addColorStop(1, '#122a52');
  c.fillStyle = g; c.fillRect(0, 0, CW, CH);
  const gold = c.createLinearGradient(0, 0, CW, CH);
  ['#9a7a34', '#fff0c0', '#b8913f', '#f6dc98'].forEach((s, i, a) => gold.addColorStop(i / (a.length - 1), s));
  c.strokeStyle = 'rgba(255,230,180,.14)'; c.lineWidth = 2;
  for (let i = 1; i < 24; i++) { c.beginPath(); c.arc(CW / 2, CH / 2, i * 38, 0, TAU); c.stroke(); }
  c.save(); c.translate(CW / 2, CH / 2);
  for (let i = 0; i < 48; i++) { c.rotate(TAU / 48); c.strokeStyle = 'rgba(255,230,180,.1)'; c.beginPath(); c.moveTo(0, 200); c.lineTo(0, 900); c.stroke(); }
  c.restore();
  c.strokeStyle = gold; c.lineWidth = 18; c.beginPath(); c.roundRect(20, 20, CW - 40, CH - 40, 48); c.stroke();
  c.lineWidth = 6; c.beginPath(); c.arc(CW / 2, CH / 2, 190, 0, TAU); c.stroke();
  c.lineWidth = 2; c.beginPath(); c.arc(CW / 2, CH / 2, 165, 0, TAU); c.stroke();
  c.fillStyle = gold; c.textAlign = 'center';
  c.font = '900 120px "Noto Serif JP", serif'; c.fillText('奈良', CW / 2, CH / 2 + 30);
  c.font = '700 26px Inter, sans-serif'; c.fillText('H O L O   C A R D', CW / 2, CH / 2 + 92);

class Spring {

  const W = innerWidth, H = innerHeight, p = document.getElementById('panel').getBoundingClientRect();
  const noui = document.body.classList.contains('noui'), narrow = W <= 760;
  let fx = 0, fy = 0, fw = W, fh = H;
  if (!noui) { if (narrow) fh = p.top; else fw = p.left; }
  view.cx = fx + fw / 2; view.cy = fy + fh / 2; view.w = fw; view.h = fh;
  renderer.setSize(W, H, false); composer.setSize(W, H);
  camera.aspect = W / H;
  const vh = Math.max(CARD_H * H / (.8 * fh), CARD_W * H / (.82 * fw) * (W / H) / camera.aspect);
  camera.position.set(0, 0, vh / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))));
  camera.setViewOffset(W, H, W / 2 - view.cx, H / 2 - view.cy, W, H);
  camera.updateProjectionMatrix();
}
addEventListener('resize', layout);

const hint = document.getElementById('hint');
const lightW = new THREE.Vector3(-.45, .75, 1).normalize(), qInv = new THREE.Quaternion(), tmpV = new THREE.Vector3();
const clock = new THREE.Clock();
let frames = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), .05); now += dt; frames++;
  if (fixed) { tilt.x = fixed.x; tilt.y = fixed.y; }
  else if (!gyro && document.getElementById('sway').checked && now - lastInput > 2.5) {
    const k = Math.min(1, (now - lastInput - 2.5) / 1.5);
    tilt.y += (Math.sin(now * .62) * .34 - tilt.y) * k * .05; tilt.x += (Math.sin(now * .45 + 1) * .2 - tilt.x) * k * .05;
  }
  rx.t = tilt.x; ry.t = tilt.y;
  rx.step(dt); ry.step(dt); spin.k = drag ? 260 : 60; spin.step(dt);
  card.rotation.set(rx.v, ry.v + spin.v, 0);
  card.position.y = fixed ? 0 : Math.sin(now * .8) * .035;
  card.updateMatrixWorld();
  U.uCam.value.copy(card.worldToLocal(tmpV.copy(camera.position)));
  U.uLight.value.copy(lightW).applyQuaternion(qInv.copy(card.quaternion).invert());
  U.uTime.value = now;
  halo.material.uniforms.uCol.value.setHSL(((ry.v * .35 + rx.v * .25 + now * .02) % 1 + 1) % 1, .6, .38);
  dust.rotation.y = now * .015; dust.position.y = Math.sin(now * .2) * .1;
  composer.render();
  window.__holo.time = now; window.__holo.frames = frames; window.__holo.spin = spin.v;
  requestAnimationFrame(frame);
}

/* ───────────── UI ───────────── */
const sliders = [
  ['uHolo', '镭射', 0, 1.6, .9], ['uHoloChar', '角色镭射', 0, 1.2, .35], ['uGlitter', '闪粉', 0, 1.6, .9], ['uLineGlow', '线稿发光', 0, 2, 1],
  ['uPar', '视差深度', 0, 2.2, 1], ['uEmboss', '压纹', 0, 2.5, 1], ['bloom', '辉光', 0, 1.6, .45],
];
const box = document.getElementById('sliders');
for (const [k, label, a, b, v] of sliders) {
  const row = document.createElement('label'); row.className = 'row';
  row.innerHTML = `<span>${label}</span><input type="range" min="${a}" max="${b}" step="0.01" value="${v}"><output>${v.toFixed(2)}</output>`;
  const inp = row.querySelector('input'), out = row.querySelector('output');
  const set = () => { const x = +inp.value; out.textContent = x.toFixed(2); if (k === 'bloom') bloom.strength = x; else U[k].value = x; };
  inp.oninput = set; inp.dataset.def = v; set(); box.appendChild(row);
}
document.querySelectorAll('#pat button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('#pat button').forEach((o) => o.classList.toggle('on', o === b)); U.uPattern.value = +b.dataset.v;
});
if (Q.has('pat')) document.querySelectorAll('#pat button')[+Q.get('pat')]?.click();

const toastEl = document.getElementById('toast');
let toastT; const toast = (s) => { toastEl.textContent = s; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 2400); };

async function handle(slot, file) {
  if (!file || !file.type.startsWith('image/')) return toast('请选择图片文件');
  const img = await loadImage(file).catch(() => null);
  if (!img) return toast('这张图打不开');
  const el = document.getElementById(slot);
  el.querySelector('.th').style.backgroundImage = `url(${img.src})`; el.classList.add('has');
  if (slot === 'dChar') {
    const c = toCanvas(img); const keyed = keyWhite(c);
    state.charSrc = c; state.box = fitBox(c); redrawChar();
    toast(keyed ? '已自动抠掉白底' + (state.lineSrc ? '' : '，并生成了发光线稿') : state.lineSrc ? '角色已更新' : '已从角色自动生成发光线稿');
  } else if (slot === 'dLine') {
    const c = toCanvas(img); state.lineSrc = c; state.lineTransparent = transparentFraction(c) > .3; redrawLine();
    toast('线稿已套用');
  } else { state.bgSrc = toCanvas(img, 2400); redrawBg(); toast('背景已更换'); }
}
for (const id of ['dChar', 'dLine', 'dBg']) {
  const el = document.getElementById(id), inp = el.querySelector('input');
  inp.onchange = () => { handle(id, inp.files[0]); inp.value = ''; };
  el.querySelector('.x').onclick = (e) => {
    e.preventDefault(); e.stopPropagation(); el.classList.remove('has'); el.querySelector('.th').style.backgroundImage = '';
    if (id === 'dChar') { state.charSrc = null; state.box = null; redrawChar(); }
    else if (id === 'dLine') { state.lineSrc = null; redrawLine(); }
    else { state.bgSrc = null; redrawBg(); }
  };
  el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('over'); });
  el.addEventListener('dragleave', () => el.classList.remove('over'));
  el.addEventListener('drop', (e) => { e.preventDefault(); e.stopPropagation(); el.classList.remove('over'); handle(id, e.dataTransfer.files[0]); });
}
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', (e) => { e.preventDefault(); if (e.dataTransfer.files[0]) handle('dChar', e.dataTransfer.files[0]); });

document.getElementById('name').oninput = drawFrame;
document.getElementById('no').oninput = drawFrame;
document.getElementById('reset').onclick = () => {
  Object.assign(state, { charSrc: null, lineSrc: null, bgSrc: null, box: null });
  document.querySelectorAll('.drop').forEach((el) => { el.classList.remove('has'); el.querySelector('.th').style.backgroundImage = ''; });
  document.getElementById('name').value = '奈良の鹿'; document.getElementById('no').value = '001';
  box.querySelectorAll('input').forEach((i) => { i.value = i.dataset.def; i.oninput(); });
  document.querySelector('#pat button').click();
  redrawBg(); redrawChar(); drawFrame(); toast('已恢复示例');
};
document.getElementById('fold').onclick = () => {
  const p = document.getElementById('panel'); p.classList.toggle('min');
  document.getElementById('fold').textContent = p.classList.contains('min') ? '展开' : '收起';
  setTimeout(layout, 420);
};

// save: render once, crop around the card's on-screen bounds
document.getElementById('save').onclick = () => {
  composer.render();
  const r = renderer.domElement, pr = renderer.getPixelRatio();
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [x, y] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
    const v = new THREE.Vector3(x * CARD_W / 2, y * CARD_H / 2, 0).applyMatrix4(card.matrixWorld).project(camera);
    const sx = (v.x * .5 + .5) * innerWidth, sy = (-v.y * .5 + .5) * innerHeight;
    x0 = Math.min(x0, sx); x1 = Math.max(x1, sx); y0 = Math.min(y0, sy); y1 = Math.max(y1, sy);
  }
  const m = 40; x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(innerWidth, x1 + m); y1 = Math.min(innerHeight, y1 + m);
  const out = mk(Math.round((x1 - x0) * pr), Math.round((y1 - y0) * pr));
  out.getContext('2d').drawImage(r, x0 * pr, y0 * pr, out.width, out.height, 0, 0, out.width, out.height);
  const a = document.createElement('a'); a.download = (document.getElementById('name').value || 'holo-card') + '.png';
  a.href = out.toDataURL('image/png'); a.click(); toast('图片已保存');
};

window.__holo = { time: 0, frames: 0, spin: 0, state, U, layout };
await document.fonts.ready.catch(() => {});
await Promise.race([document.fonts.load('900 60px "Noto Serif JP"', '奈良の鹿'), new Promise((r) => setTimeout(r, 2500))]).catch(() => {});
drawBack(); T.back.needsUpdate = true;
redrawBg(); redrawChar(); drawFrame();
layout();
requestAnimationFrame(frame);
</script>
</body>
