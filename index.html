<script type="module">
import * as THREE from 'three';

// ================================================================ content
const CARDS = [
  { id: 'deer', ja: '奈良公園', en: 'Nara Park', copy: '鹿と目が合ったら、旅のはじまり。',
    desc: '約1,300頭の鹿が暮らす広い公園。鹿せんべいを手にした瞬間、あっという間に囲まれます。',
    rows: [['ACCESS', '近鉄奈良駅から徒歩5分'], ['BEST', '朝の7時、人が少ない時間'], ['TIP', 'お辞儀をすると、鹿もお辞儀を返す']],
    paper: '#f2eadb', ink: '#231f1a', accent: '#c9532e', bg: ['#1c150e', '#3d2a18'] },
  { id: 'todaiji', ja: '東大寺', en: 'Todai-ji', copy: '見上げるほど、小さくなれる。',
    desc: '世界最大級の木造建築、大仏殿。高さ約15mの盧舎那仏が、静かに迎えてくれます。',
    rows: [['ACCESS', '近鉄奈良駅から徒歩20分'], ['BEST', '開門直後の朝'], ['TIP', '柱の穴をくぐると無病息災']],
    paper: '#16203a', ink: '#f1e4c4', accent: '#d9a441', bg: ['#070b18', '#1a2547'] },
  { id: 'pagoda', ja: '興福寺', en: 'Kofuku-ji', copy: '五つの屋根に、千三百年。',
    desc: '奈良のシンボル、五重塔。高さ約50mで、京都・東寺に次ぐ日本で二番目の高さです。',
    rows: [['ACCESS', '近鉄奈良駅から徒歩5分'], ['BEST', '夕暮れ'], ['TIP', '猿沢池の水面に、もう一つの塔']],
    paper: '#f4dfc6', ink: '#2a1a1c', accent: '#b8432f', bg: ['#1d0d0c', '#5a2a22'] },
  { id: 'lantern', ja: '春日大社', en: 'Kasuga Taisha', copy: '三千の灯りが、道を照らす。',
    desc: '約3,000基の燈籠が並ぶ朱色の社。節分と夏の万燈籠では、すべての燈籠に火が灯ります。',
    rows: [['ACCESS', 'バス「春日大社本殿」すぐ'], ['BEST', '万燈籠の夜'], ['TIP', '参道の鹿は、神様の使い']],
    paper: '#10241d', ink: '#efe3c8', accent: '#e8b04a', bg: ['#04100c', '#123428'] },
  { id: 'wakakusa', ja: '若草山', en: 'Mt. Wakakusa', copy: '山が燃える夜、冬が終わる。',
    desc: '三つの丘が重なる芝の山。1月の山焼きでは山全体が炎に包まれ、山頂からは奈良の街を一望できます。',
    rows: [['ACCESS', '東大寺から徒歩15分'], ['BEST', '夜景、1月の山焼き'], ['TIP', '山頂までは約40分']],
    paper: '#0f1431', ink: '#f2e6da', accent: '#ff7a3d', bg: ['#05071a', '#24204a'] },
  { id: 'naramachi', ja: 'ならまち', en: 'Naramachi', copy: '格子の向こうに、町の時間。',
    desc: '江戸から明治の町家が残る旧市街。古民家カフェや雑貨店を、のんびり歩いて巡れます。',
    rows: [['ACCESS', '近鉄奈良駅から徒歩15分'], ['BEST', '平日の午後'], ['TIP', '軒先の赤い「身代わり申」は魔除け']],
    paper: '#efe2cc', ink: '#2b2018', accent: '#2b3f6c', bg: ['#140e09', '#3b2a1d'] },
  { id: 'next', ja: 'あなたの一枚', en: 'Your Photo', copy: '次の旅人へ、写真をつなごう。',
    desc: 'このカードの写真は、前の旅人が撮ったもの。あなたが撮る一枚が、次の誰かの奈良になります。',
    rows: [['STEP 1', '奈良で一枚、撮る'], ['STEP 2', 'カードにする'], ['STEP 3', '次の人へ渡す']],
    paper: '#1a1830', ink: '#efe9ff', accent: '#9d8cff', bg: ['#08071a', '#2c2458'] },
];
const NC = CARDS.length;

const ALL_TEXT = CARDS.map((c) => c.ja + c.copy + c.desc + c.rows.flat().join('')).join('') + '前の旅人タップで戻る';
await Promise.all([
  ['900', 'Noto Serif JP'], ['700', 'Noto Serif JP'], ['400', 'Noto Sans JP'], ['700', 'Noto Sans JP'], ['900', 'Noto Sans JP'],
].map(([w, f]) => document.fonts.load(`${w} 40px "${f}"`, ALL_TEXT)).concat([document.fonts.load('500 20px "IBM Plex Mono"', 'PHOTO')]));

// ================================================================ utils
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const outBack = (x) => { const c = 1.5; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const damp = (a, b, r, dt) => lerp(a, b, 1 - Math.exp(-r * dt));
const TAU = Math.PI * 2;
let seed = 3;
const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

// ================================================================ card art (procedural "photos")
const CW = 900, CH = 1260, AX = 36, AY = 36, AW = 828, AH = 740;
const noise = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), d = g.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return c;
})();
const grad = (c, y0, y1, stops) => { const g = c.createLinearGradient(0, y0, 0, y1); stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s)); return g; };
const circle = (c, x, y, r, fill) => { c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = fill; c.fill(); };
const poly = (c, pts, fill) => { c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.closePath(); c.fillStyle = fill; c.fill(); };
const glow = (c, x, y, r, col) => { const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2); };
// a temple roof with upturned eaves
const roof = (c, cx, y, hw, h, fill) => {
  c.beginPath(); c.moveTo(cx - hw - 18, y - 4); c.quadraticCurveTo(cx - hw * 0.72, y + 2, cx - hw * 0.5, y - h);
  c.lineTo(cx + hw * 0.5, y - h); c.quadraticCurveTo(cx + hw * 0.72, y + 2, cx + hw + 18, y - 4);
  c.lineTo(cx + hw, y + 10); c.lineTo(cx - hw, y + 10); c.closePath(); c.fillStyle = fill; c.fill();
};

// Each picture is painted in depth layers: L(d) starts a new layer at depth d (0 = far, 1 = near).
// The layers flatten into the photo, and their silhouettes into a depth map the card shader uses for parallax.
const ART = {
  deer(c, L) {
    c.fillStyle = grad(c, 0, AH, ['#f6e7c8', '#efcf9f', '#e2a877']); c.fillRect(0, 0, AW, AH);
    glow(c, 560, 250, 300, 'rgba(255,190,120,.55)'); circle(c, 560, 250, 120, '#d4552f');
    const hill = (y, a, f, col) => { c.beginPath(); c.moveTo(0, AH); for (let x = 0; x <= AW; x += 8) c.lineTo(x, y + Math.sin(x * f + a) * 26); c.lineTo(AW, AH); c.fillStyle = col; c.fill(); };
    L(0.3); hill(470, 1, 0.006, '#9c8f6a');
    L(0.5); hill(560, 3, 0.009, '#5f6b49');
    L(0.72); hill(660, 0.5, 0.004, '#2f3926');
    // trees
    for (const [x, s] of [[90, 1], [160, 0.75], [730, 1.15]]) { c.fillStyle = '#26301f'; c.fillRect(x - 6 * s, 560 - 40 * s, 12 * s, 120 * s); circle(c, x, 520 - 40 * s, 70 * s, '#26301f'); circle(c, x - 40 * s, 560 - 40 * s, 50 * s, '#26301f'); circle(c, x + 40 * s, 560 - 40 * s, 50 * s, '#26301f'); }
    // deer
    L(1); c.save(); c.translate(80, 40); c.fillStyle = '#211c16'; c.strokeStyle = '#211c16'; c.lineCap = 'round';
    c.beginPath(); c.ellipse(330, 520, 120, 52, 0, 0, TAU); c.fill();
    poly(c, [[395, 505], [432, 405], [466, 412], [446, 528]], '#211c16');
    c.beginPath(); c.ellipse(470, 398, 40, 22, -0.25, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(503, 410, 21, 13, -0.2, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(440, 380, 22, 8, -0.7, 0, TAU); c.fill();
    c.lineWidth = 8; c.beginPath(); c.moveTo(462, 380); c.lineTo(440, 318); c.lineTo(424, 262); c.moveTo(440, 318); c.lineTo(404, 300); c.moveTo(452, 348); c.lineTo(482, 318); c.stroke();
    c.lineWidth = 15; for (const [x0, x1] of [[250, 242], [282, 292], [380, 372], [408, 424]]) { c.beginPath(); c.moveTo(x0, 545); c.lineTo(x1, 655); c.stroke(); }
    c.beginPath(); c.ellipse(212, 505, 16, 10, 0.4, 0, TAU); c.fill();
    c.restore();
  },
  todaiji(c, L) {
    c.fillStyle = grad(c, 0, AH, ['#0c1226', '#1b2750', '#3a3f6a']); c.fillRect(0, 0, AW, AH);
    for (let i = 0; i < 70; i++) circle(c, rnd() * AW, rnd() * 380, rnd() * 1.6 + 0.4, `rgba(255,240,210,${0.3 + rnd() * 0.6})`);
    L(0.15); glow(c, 640, 190, 220, 'rgba(244,220,160,.35)'); circle(c, 640, 190, 64, '#f4dca0');
    const ink = '#070a16', cx = 414;
    L(0.95); c.fillStyle = ink; c.fillRect(110, 640, 610, 100);
    L(0.7); c.fillStyle = ink; c.fillRect(150, 600, 530, 44);
    c.fillRect(214, 500, 400, 104);
    c.fillStyle = 'rgba(217,164,65,.22)'; for (let x = 232; x < 600; x += 46) c.fillRect(x, 512, 6, 88);
    roof(c, cx, 505, 300, 62, ink);
    c.fillStyle = ink; c.fillRect(264, 384, 300, 70);
    roof(c, cx, 392, 250, 94, ink);
    c.fillStyle = '#d9a441'; c.fillRect(cx - 120, 292, 240, 8);
    poly(c, [[cx - 128, 300], [cx - 118, 262], [cx - 104, 268], [cx - 108, 300]], '#d9a441');
    poly(c, [[cx + 128, 300], [cx + 118, 262], [cx + 104, 268], [cx + 108, 300]], '#d9a441');
    glow(c, cx, 420, 70, 'rgba(255,200,110,.6)'); c.fillStyle = '#f0c46a'; c.fillRect(cx - 30, 408, 60, 26);
  },
  pagoda(c, L) {
    c.fillStyle = grad(c, 0, AH, ['#f7d9b2', '#ef9f6c', '#c2563f', '#5b2a2a']); c.fillRect(0, 0, AW, AH);
    glow(c, 414, 360, 320, 'rgba(255,236,200,.6)'); circle(c, 414, 360, 125, 'rgba(255,240,215,.9)');
    L(0.35);
    const ink = '#2a1a1c', water = 640;
    const draw = () => {
      c.fillStyle = ink; c.fillRect(300, water - 20, 228, 20);
      for (let k = 0; k < 5; k++) {
        const hw = 168 - k * 21, y = water - 22 - k * 74;
        c.fillStyle = ink; c.fillRect(414 - hw * 0.5, y - 46, hw, 46);
        roof(c, 414, y - 44, hw, 26, ink);
      }
      c.fillRect(410, water - 22 - 5 * 74 - 140, 8, 150);
      for (let i = 0; i < 9; i++) { c.beginPath(); c.ellipse(414, water - 410 - i * 12, 14, 3, 0, 0, TAU); c.fill(); }
    };
    // hills behind
    c.beginPath(); c.moveTo(0, water); c.quadraticCurveTo(200, 520, 420, 600); c.quadraticCurveTo(640, 540, AW, water); c.fillStyle = 'rgba(70,30,32,.7)'; c.fill();
    L(0.68); draw();
    L(0.9); c.fillStyle = grad(c, water, AH, ['#7a3a33', '#2c1416']); c.fillRect(0, water, AW, AH - water);
    c.save(); c.beginPath(); c.rect(0, water, AW, AH - water); c.clip(); c.translate(0, water * 2); c.scale(1, -1); c.globalAlpha = 0.28; draw(); c.restore();
    c.strokeStyle = 'rgba(255,220,190,.35)'; c.lineWidth = 2; for (let i = 0; i < 9; i++) { const y = water + 14 + i * 10, w = 60 + rnd() * 160; c.beginPath(); c.moveTo(414 - w, y); c.lineTo(414 + w, y); c.stroke(); }
  },
  lantern(c, L) {
    c.fillStyle = grad(c, 0, AH, ['#0d221b', '#0a1a14', '#050d0a']); c.fillRect(0, 0, AW, AH);
    L(0.25);
    for (let x = 40; x < AW; x += 96) { c.fillStyle = 'rgba(176,52,32,.75)'; c.fillRect(x, 150, 22, 330); }
    c.fillStyle = 'rgba(176,52,32,.75)'; c.fillRect(0, 150, AW, 22); c.fillRect(0, 200, AW, 10);
    const lantern = (x, y, s) => {
      const st = '#7b7c6c';
      glow(c, x, y - 120 * s, 120 * s, 'rgba(255,190,90,.55)');
      c.fillStyle = st; c.fillRect(x - 34 * s, y - 16 * s, 68 * s, 16 * s);
      c.fillRect(x - 9 * s, y - 92 * s, 18 * s, 78 * s);
      c.fillRect(x - 30 * s, y - 100 * s, 60 * s, 10 * s);
      c.fillStyle = '#ffd27a'; c.fillRect(x - 22 * s, y - 146 * s, 44 * s, 46 * s);
      c.fillStyle = st; c.fillRect(x - 4 * s, y - 146 * s, 8 * s, 46 * s);
      poly(c, [[x - 46 * s, y - 146 * s], [x + 46 * s, y - 146 * s], [x + 16 * s, y - 180 * s], [x - 16 * s, y - 180 * s]], st);
      circle(c, x, y - 186 * s, 9 * s, st);
    };
    for (let r = 0; r < 3; r++) {
      L(0.5 + r * 0.25);
      const s = 0.55 + r * 0.3, y = 470 + r * 120, sp = 170 * s;
      for (let x = (r % 2) * sp * 0.5 - 20; x < AW + 60; x += sp) lantern(x, y, s);
    }
    c.fillStyle = grad(c, 560, AH, ['rgba(5,13,10,0)', 'rgba(5,13,10,.85)']); c.fillRect(0, 560, AW, AH - 560);
  },
  wakakusa(c, L) {
    c.fillStyle = grad(c, 0, AH, ['#05071a', '#1a1840', '#3a2550']); c.fillRect(0, 0, AW, AH);
    for (let i = 0; i < 120; i++) circle(c, rnd() * AW, rnd() * 420, rnd() * 1.5 + 0.3, `rgba(255,240,230,${0.25 + rnd() * 0.7})`);
    const ridge = (dy) => { c.beginPath(); c.moveTo(-20, 640 + dy); c.quadraticCurveTo(110, 420 + dy, 250, 470 + dy); c.quadraticCurveTo(410, 330 + dy, 560, 430 + dy); c.quadraticCurveTo(700, 380 + dy, 860, 560 + dy); };
    glow(c, 414, 470, 380, 'rgba(255,110,50,.28)');
    L(0.55); ridge(0); c.lineTo(AW, AH); c.lineTo(0, AH); c.closePath(); c.fillStyle = '#080a18'; c.fill();
    c.save(); c.shadowColor = '#ff6a2a'; c.shadowBlur = 30; c.lineCap = 'round';
    for (const [dy, w, col] of [[22, 10, 'rgba(255,120,50,.9)'], [60, 6, 'rgba(255,150,70,.7)'], [104, 4, 'rgba(255,170,90,.5)']]) {
      c.setLineDash([26, 14, 8, 18]); c.lineWidth = w; c.strokeStyle = col; ridge(dy); c.stroke();
    }
    c.restore();
    for (let i = 0; i < 60; i++) circle(c, rnd() * AW, 420 + rnd() * 180, rnd() * 2 + 1, `rgba(255,${150 + rnd() * 80},80,${rnd() * 0.8})`);
    L(0.95); c.fillStyle = '#05060f'; c.fillRect(0, 650, AW, 90);
    for (let i = 0; i < 160; i++) circle(c, rnd() * AW, 660 + rnd() * 70, rnd() * 1.8 + 0.4, `rgba(255,${200 + rnd() * 50},150,${0.3 + rnd() * 0.6})`);
  },
  naramachi(c, L) {
    L(0.25); c.fillStyle = '#3b2a1e'; c.fillRect(0, 0, AW, AH);
    c.fillStyle = '#1f1610'; c.fillRect(0, 0, AW, 120);
    for (let y = 18; y < 120; y += 22) { c.fillStyle = 'rgba(255,255,255,.05)'; c.fillRect(0, y, AW, 3); }
    c.fillStyle = '#2a1d14'; c.fillRect(0, 120, AW, 20);
    c.fillStyle = '#5c412d'; for (let x = 30; x < AW; x += 24) c.fillRect(x, 150, 11, 520);
    c.fillStyle = '#4a3324'; for (const y of [150, 300, 470, 660]) c.fillRect(0, y, AW, 12);
    // noren
    L(0.6); const nx = 290, nw = 250;
    for (let i = 0; i < 3; i++) { c.fillStyle = '#2b3f6c'; c.fillRect(nx + i * (nw / 3) + 3, 140, nw / 3 - 6, 280); }
    circle(c, nx + nw / 2, 260, 38, '#efe2cc'); circle(c, nx + nw / 2, 260, 24, '#2b3f6c');
    c.fillStyle = '#1b2a4a'; c.fillRect(nx - 10, 134, nw + 20, 12);
    // paper lantern
    L(0.85); glow(c, 140, 300, 170, 'rgba(255,190,110,.55)');
    c.beginPath(); c.ellipse(140, 300, 46, 66, 0, 0, TAU); c.fillStyle = '#f7d9a4'; c.fill();
    c.strokeStyle = 'rgba(150,80,40,.5)'; c.lineWidth = 2; for (let y = 250; y < 360; y += 14) { c.beginPath(); c.ellipse(140, y, 44 - Math.abs(y - 300) * 0.3, 4, 0, 0, TAU); c.stroke(); }
    c.fillStyle = '#1b130d'; c.fillRect(126, 228, 28, 10); c.fillRect(126, 362, 28, 10);
    // migawari-zaru: a string of red monkeys
    L(1); c.strokeStyle = '#1b130d'; c.lineWidth = 3; c.beginPath(); c.moveTo(680, 140); c.lineTo(680, 560); c.stroke();
